# Local development: the issuer frontend.
#
#   1. In the eudi-srv-issuer-oidc-py checkout:  ./pki/bootstrap.sh
#   2. In the eudi-srv-issuer-oidc-py checkout:  docker compose up -d
#   3. In the eudi-srv-web-issuing-eudiw-py checkout: ./pki/bootstrap.sh && docker compose up -d
#   4. Here:                                     docker compose up --build
#
# See DOCKER.md. The repositories are joined by a Docker network name and a
# volume name, never by a path, so they can be cloned anywhere.
#
# This is the web UI a person uses to request a credential. It talks to the
# issuer backend and the authorization server, so both should be running; the
# pages load either way but issuance will not complete.
#
# The TLS material comes from the shared development CA created by the
# authorization server's pki/bootstrap.sh. That script issues a leaf for this
# service too, with SANs for the compose name and localhost.
#
# Note on the filename: upstream's docker-compose.yml (published ghcr.io image)
# is untouched and still works with `docker compose -f docker-compose.yml up`.
# Compose prefers compose.yaml, so a bare `docker compose up` runs this one.

name: eudiw-frontend

services:

  frontend:
    # Fixed so the name does not change when this stack is run on its own versus
    # merged into a larger project (compose otherwise derives it from the
    # project name). Scripts and `docker exec` can rely on it.
    container_name: eudiw-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: eudiw-frontend:dev
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command:
      - flask
      - --app
      - app
      - run
      - --host=0.0.0.0
      - --port=5602
      - --cert=/etc/eudiw/tls/frontend.crt
      - --key=/etc/eudiw/tls/frontend.key
    # At startup this app asks the issuer to sign its metadata and exits if the
    # call fails, so it waits for the issuer to report healthy. Compose resolves
    # this across the merged project; running this stack alone, the condition is
    # ignored and restart: unless-stopped covers the gap.
    depends_on:
      issuer:
        condition: service_healthy
        required: false
    ports:
      - "${FRONTEND_PORT:-5602}:5602"
    environment:
      # Where the entrypoint reads the template and writes the rendered config.
      CONFIG_TEMPLATE: /tmp/config.yaml.template
      ISSUER_CONFIG_PATH: /config.yaml

      # Substituted into the template. These are what a browser dials, so they
      # are host-visible URLs rather than container names.
      FRONTEND_PUBLIC_URL: "https://localhost:${FRONTEND_PORT:-5602}"
      ISSUER_PUBLIC_URL: "https://localhost:${ISSUER_PORT:-5600}"
      OIDC_PUBLIC_URL: "https://localhost:${OIDC_PORT:-5601}"

      # Host written into app/metadata_config/*.json by the entrypoint; those
      # files hardcode it and the app has no setting for it.
      FRONTEND_HOST: "localhost"

      # Trust the dev CA for outbound HTTPS instead of disabling verification.
      REQUESTS_CA_BUNDLE: /etc/eudiw/tls/ca-bundle.pem
      SSL_CERT_FILE: /etc/eudiw/tls/ca-bundle.pem

      FLASK_DEBUG: "${FLASK_DEBUG:-1}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Config template, rendered at start and never written back.
      - ./docker/config.yaml.template:/tmp/config.yaml.template:ro
      # Shared TLS material, the same volume the other stacks mount.
      - eudiw-pki:/etc/eudiw/tls:ro
      # Live code reload. The image still contains the app, so the stack runs
      # unchanged in CI where this mount is absent.
      - ./app:/app/app
      # ...but not metadata_config: the entrypoint rewrites the host in those
      # JSONs at startup, and with the bind mount above that edit would land on
      # tracked files. An anonymous volume keeps the image's copy in place.
      - /app/app/metadata_config
    networks: [eudiw-dev]
    # backend_url and oauth_url serve two callers at once: this container makes
    # server-side calls with them (metadata_signer at startup, pushed
    # authorization), and the browser follows them as redirects. There is no
    # separate internal_url here as there is in the issuer, so one value has to
    # satisfy both.
    #
    # Mapping localhost to the sibling containers is what lets a browser-facing
    # URL also resolve from inside. The issuer's certificate carries a SAN for
    # localhost, so TLS still verifies.
    # host-gateway resolves to the Docker host, where both sibling services
    # publish their ports. Docker substitutes the right address, so nothing here
    # depends on a subnet that changes when the network is recreated.
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped

volumes:
  eudiw-pki:
    # Created and filled by the authorization server's pki/bootstrap.sh, before
    # any stack starts. Mounted read-only here.
    external: true
    name: eudiw-pki

networks:
  eudiw-dev:
    # Shared with the other stacks. The explicit name is what makes them the
    # same network rather than several project-prefixed ones.
    name: eudiw-dev
