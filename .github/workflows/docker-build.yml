# Build and push to GHCR. Deployment is a separate manual workflow.
#
# Sits alongside upstream's pipeline.yml, which triggers on `dev` and `preprod`,
# branches this fork does not have.
#
# `grnet` rather than `main`: main is a clean upstream mirror here, so building
# it would republish on every sync.

name: Docker build

on:
  push:
    branches:
      - grnet
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Fork PRs cannot read secrets, and unreviewed code should not publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          # `source` links the package to its repository.
          labels: |
            org.opencontainers.image.description=Web frontend for the EUDIW issuer (GRNET fork).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # This service asks the issuer to sign its metadata at startup and exits
      # if that call fails, so it cannot be started on its own the way the other
      # two can. What is checked instead is that the entrypoint runs, renders
      # the config template and rewrites the metadata, which is where a broken
      # image would show up. The full three-service flow is covered by the
      # compose stack rather than here.
      # Imports only: running the app needs frontend_config.yaml, which is
      # mounted at deploy time. Catches a dependency whose C library is missing
      # from the runtime stage.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing $IMAGE"

          docker run --rm "$IMAGE" python3 -c "
          import flask, requests, jsonschema, yaml
          print('imports ok')
          "
          # The Node stage builds this; without it every page renders unstyled.
          docker run --rm --entrypoint sh "$IMAGE" -c "test -s app/static/css/tailwind.css"
          echo "image is runnable"
